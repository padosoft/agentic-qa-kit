name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'task/**'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  meta:
    name: Meta (workflow lint + link check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Markdown link check
        continue-on-error: true
        run: |
          bunx --bun markdown-link-check --quiet 'docs/**/*.md' README.md AGENTS.md CLAUDE.md GEMINI.md .github/copilot-instructions.md
        # advisory at bootstrap (continue-on-error); flip to hard-fail once docs stabilize.
        # Failure is surfaced visibly in the job summary even though it does not fail the workflow.

  typecheck-lint:
    name: Typecheck + Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install documentation dependencies
        working-directory: docs-site
        run: npm ci

      - name: Lint (Biome)
        run: bun run lint

      - name: Build dependencies first
        # Workspace packages reference each other via their published entry
        # (dist/index.{js,d.ts}). Typecheck of a downstream package therefore
        # needs the upstream dist to exist. Run a full build before typecheck.
        if: ${{ hashFiles('packages/**/tsconfig.json') != '' }}
        run: bun run build:workspace

      - name: Typecheck (all workspaces)
        run: bun run typecheck
        if: ${{ hashFiles('packages/**/tsconfig.json') != '' }}

  test-unit:
    name: Unit tests (Bun)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [typecheck-lint]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build all workspaces (tests import the built dist/)
        if: ${{ hashFiles('packages/**/*.test.ts') != '' }}
        run: bun run build:workspace

      - name: Run unit tests
        if: ${{ hashFiles('packages/**/*.test.ts') != '' }}
        # Bun's test runner discovers test/*.test.ts across the workspace and
        # executes them via the Bun runtime (node:test API is bun-compatible).
        # Running build first guarantees dist/index.js exists for test imports.
        #
        # By design this job validates only the Bun execution path: the same
        # test files run under plain Node 22 (with --experimental-strip-types)
        # in the separate "Unit tests (Node 22 LTS)" job, so both runtimes are
        # gated independently.
        run: bun test --coverage

      - name: Skip notice
        if: ${{ hashFiles('packages/**/*.test.ts') == '' }}
        run: echo "No tests yet — gate placeholder."

  test-unit-node:
    name: Unit tests (Node 22 LTS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [typecheck-lint]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup Bun (for monorepo manager only)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build all workspaces topologically
        # The downstream packages' pretest hook compiles against the upstream
        # packages' dist/. Build once up front in topological order so each
        # package's pretest sees a fresh dist for everything it imports.
        if: ${{ hashFiles('packages/**/tsconfig.json') != '' }}
        run: bun run build:workspace

      - name: Run unit tests under Node
        env:
          AQA_PKG_RUNNER: npm
        run: |
          set -e
          if [ ! -d packages ]; then
            echo "No packages directory yet — gate placeholder (pass)."
            exit 0
          fi
          # `bun install` populated node_modules at the repo root (workspace hoisting)
          # and inside each package, so `npm run` from a package dir resolves bins
          # and dependencies fine without ever needing a package-lock.json. `npm`
          # here is used purely as a script runner — no install step.
          worst=0
          for pkg in packages/*/; do
            if [ -f "$pkg/package.json" ] && grep -q '"test"' "$pkg/package.json"; then
              echo "::group::Testing $pkg under Node"
              # Each package's "test" script is the canonical entrypoint: it builds the
              # package (pretest hook) and runs node --test against the result. We run
              # it via npm so the Node 22 fallback gate exercises Node-only execution
              # of both the build and the tests — not Bun's runtime.
              if ! (cd "$pkg" && npm run --silent test); then
                echo "::error::Node tests failed in $pkg"
                worst=1
              fi
              echo "::endgroup::"
            fi
          done
          exit $worst

  test-postgres:
    name: Integration (PostgreSQL 16 store)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [typecheck-lint]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aqa
          POSTGRES_PASSWORD: aqa-ci-only
          POSTGRES_DB: aqa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aqa -d aqa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build workspace
        run: bun run build:workspace

      - name: Run PostgreSQL persistence contract
        env:
          AQA_TEST_POSTGRES_DSN: postgres://aqa:aqa-ci-only@127.0.0.1:5432/aqa_test
        run: |
          bun test packages/store/test/store.test.ts
          bun test packages/server/test/postgres-queue.test.ts
          bun test packages/auth/test/oidc-session.test.ts
          bun test packages/auth/test/postgres-scim-token.test.ts
          bun test packages/server/test/event-bus.test.ts

  test-container-sandbox:
    name: Integration (OCI container sandbox)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [typecheck-lint]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build sandbox
        run: bun run --filter @aqa/sandbox build
      - name: Run real Docker sandbox contract
        working-directory: packages/sandbox
        env:
          AQA_TEST_CONTAINER_RUNTIME: docker
        run: bun test test/sandbox.test.ts

  validate-helm:
    name: Validate Helm deployment chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate air-gap installer syntax
        run: bash -n scripts/air-gap-install.sh
      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Lint chart
        run: helm lint deploy/helm
      - name: Render default and production-shaped values
        run: |
          helm template aqa deploy/helm > /tmp/aqa-default.yaml
          helm template aqa deploy/helm \
            --set ingress.enabled=true \
            --set ingress.tls.enabled=true \
            --set ingress.tls.secretName=aqa-tls \
            --set postgres.urlSecretRef=aqa-db \
            > /tmp/aqa-production.yaml
          test -s /tmp/aqa-default.yaml
          test -s /tmp/aqa-production.yaml
          grep -q 'PersistentVolumeClaim' /tmp/aqa-production.yaml
          test "$(grep -c 'name: AQA_STORE_DSN' /tmp/aqa-production.yaml)" -eq 1
          test "$(grep -c 'name: AQA_QUEUE_DSN' /tmp/aqa-production.yaml)" -eq 1
          test "$(grep -c 'name: AQA_OIDC_SESSION_DSN' /tmp/aqa-production.yaml)" -eq 1
          test "$(grep -c 'name: AQA_EVENT_BUS_DSN' /tmp/aqa-production.yaml)" -eq 1
          test "$(grep -c 'name: AQA_SCIM_TOKEN_DSN' /tmp/aqa-production.yaml)" -eq 1
          ! grep -q 'namespaceSelector: {}' /tmp/aqa-production.yaml

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [typecheck-lint]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (all workspaces)
        run: |
          if [ -d packages ]; then
            npm --prefix docs-site ci
            bun run build
          else
            echo "No packages yet — gate placeholder."
          fi

  e2e-cli:
    name: E2E (CLI smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build all workspaces
        run: |
          npm --prefix docs-site ci
          bun run build

      - name: Run CLI smoke checks
        run: bun run test:e2e-cli

      - name: Run performance evidence threshold journey
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)"
          cat > "$fixture/k6.json" <<'JSON'
          {"metrics":{"http_req_duration":{"values":{"p(95)":250}}}}
          JSON
          cat > "$fixture/thresholds.json" <<'JSON'
          {"max_p95_ms":100}
          JSON
          set +e
          node packages/kit/dist/cli.cjs ingest k6 "$fixture/k6.json" --threshold-file "$fixture/thresholds.json"
          exit_code=$?
          set -e
          test "$exit_code" -eq 2
          test -n "$(find .aqa/ingest -name '*.threshold.json' -print -quit)"

  e2e:
    name: E2E (Playwright, admin UI)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        if: ${{ hashFiles('packages/admin/playwright.config.*') != '' }}
        # Playwright 1.60 launches Chromium through its separate headless
        # shell in headless CI. Install both artifacts explicitly so a
        # browser package update cannot leave the runner half-provisioned.
        working-directory: packages/admin
        run: bun run test:install-browsers

      - name: Build admin (Vite) for the dev server Playwright will boot
        if: ${{ hashFiles('packages/admin/playwright.config.*') != '' }}
        run: |
          npm --prefix docs-site ci
          bun run build

      - name: Run Playwright (admin SPA)
        if: ${{ hashFiles('packages/admin/playwright.config.*') != '' }}
        working-directory: packages/admin
        run: bun run test:e2e

      - name: Skip notice
        if: ${{ hashFiles('packages/admin/playwright.config.*') == '' }}
        run: echo "No playwright config under packages/admin — gate placeholder."

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
