name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'task/**'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  meta:
    name: Meta (workflow lint + link check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Markdown link check
        continue-on-error: true
        run: |
          bunx --bun markdown-link-check --quiet 'docs/**/*.md' README.md AGENTS.md CLAUDE.md GEMINI.md .github/copilot-instructions.md
        # advisory at bootstrap (continue-on-error); flip to hard-fail once docs stabilize.
        # Failure is surfaced visibly in the job summary even though it does not fail the workflow.

  typecheck-lint:
    name: Typecheck + Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install documentation dependencies
        working-directory: docs-site
        # The native ONNX package runs a platform-specific binary download
        # during install. Documentation builds do not execute that optional
        # native path; skipping lifecycle scripts keeps CI hermetic and avoids
        # an external NuGet outage turning the repository gate red.
        run: npm ci --ignore-scripts

      - name: Audit documentation dependency graph
        working-directory: docs-site
        run: npm audit --audit-level=high

      - name: Check documentation source
        working-directory: docs-site
        run: npm run check

      - name: Lint (Biome)
        run: bun run lint

      - name: Build dependencies first
        # Workspace packages reference each other via their published entry
        # (dist/index.{js,d.ts}). Typecheck of a downstream package therefore
        # needs the upstream dist to exist. Run a full build before typecheck.
        if: ${{ hashFiles('packages/**/tsconfig.json') != '' }}
        run: bun run build:workspace

      - name: Typecheck (all workspaces)
        run: bun run typecheck
        if: ${{ hashFiles('packages/**/tsconfig.json') != '' }}

  test-unit:
    name: Unit tests (Bun)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [typecheck-lint]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build all workspaces (tests import the built dist/)
        run: bun run build:workspace

      - name: Run unit tests
        # Bun's test runner discovers test/*.test.ts across the workspace and
        # executes them via the Bun runtime (node:test API is bun-compatible).
        # Running build first guarantees dist/index.js exists for test imports.
        #
        # By design this job validates only the Bun execution path: the same
        # test files run under plain Node 22 (with --experimental-strip-types)
        # in the separate "Unit tests (Node 22 LTS)" job, so both runtimes are
        # gated independently.
        run: bun test --coverage

  test-unit-node:
    name: Unit tests (Node 22 LTS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [typecheck-lint]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup Bun (for monorepo manager only)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build all workspaces topologically
        # The downstream packages' pretest hook compiles against the upstream
        # packages' dist/. Build once up front in topological order so each
        # package's pretest sees a fresh dist for everything it imports.
        run: bun run build:workspace

      - name: Run unit tests under Node
        env:
          AQA_PKG_RUNNER: npm
        run: |
          set -e
          test -d packages
          # `bun install` populated node_modules at the repo root (workspace hoisting)
          # and inside each package, so `npm run` from a package dir resolves bins
          # and dependencies fine without ever needing a package-lock.json. `npm`
          # here is used purely as a script runner — no install step.
          worst=0
          for pkg in packages/*/; do
            if [ -f "$pkg/package.json" ] && grep -q '"test"' "$pkg/package.json"; then
              echo "::group::Testing $pkg under Node"
              # Each package's "test" script is the canonical entrypoint: it builds the
              # package (pretest hook) and runs node --test against the result. We run
              # it via npm so the Node 22 fallback gate exercises Node-only execution
              # of both the build and the tests — not Bun's runtime.
              if ! (cd "$pkg" && npm run --silent test); then
                echo "::error::Node tests failed in $pkg"
                worst=1
              fi
              echo "::endgroup::"
            fi
          done
          exit $worst

  test-postgres:
    name: Integration (PostgreSQL 16 store)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [typecheck-lint]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aqa
          POSTGRES_PASSWORD: aqa-ci-only
          POSTGRES_DB: aqa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aqa -d aqa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build workspace
        run: bun run build:workspace

      - name: Run PostgreSQL persistence contract
        env:
          AQA_TEST_POSTGRES_DSN: postgres://aqa:aqa-ci-only@127.0.0.1:5432/aqa_test
        run: |
          bun test packages/store/test/store.test.ts
          bun test packages/server/test/postgres-queue.test.ts
          bun test packages/server/test/postgres-idempotency.test.ts
          bun test packages/cost/test/postgres-ledger.test.ts
          bun test packages/commerce/test/promotion-ledger.test.ts
          bun test packages/auth/test/oidc-session.test.ts
          bun test packages/auth/test/postgres-scim-token.test.ts
          bun test packages/integrations/test/webhook.test.ts
          bun test packages/server/test/event-bus.test.ts
          bun test packages/runner/test/postgres-driver.test.ts
          bun test packages/runner/test/postgres-trajectory.test.ts
          AQA_TEST_POSTGRES_DSN="$AQA_TEST_POSTGRES_DSN" bun test packages/kit/test/run-cmd.test.ts

      - name: Test and run PostgreSQL backup/restore journey
        env:
          AQA_TEST_POSTGRES_DSN: postgres://aqa:aqa-ci-only@127.0.0.1:5432/aqa_test
        run: |
          node --test scripts/postgres-backup-restore-journey.test.mjs
          node scripts/postgres-backup-restore-journey.mjs

  test-s3:
    name: Integration (S3-compatible artifact store)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [typecheck-lint]
    services:
      minio:
        image: quay.io/minio/minio@sha256:a1a8bd4ac40ad7881a245bab97323e18f971e4d4cba2c2007ec1bedd21cbaba2
        env:
          MINIO_ROOT_USER: aqa-ci-access
          MINIO_ROOT_PASSWORD: aqa-ci-secret
        ports:
          - 9000:9000
        command: server /data
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build workspace
        run: bun run build:workspace

      - name: Wait for MinIO readiness
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "MinIO did not become ready" >&2
          exit 1

      - name: Run real S3-compatible artifact journey
        env:
          AQA_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          AWS_ACCESS_KEY_ID: aqa-ci-access
          AWS_SECRET_ACCESS_KEY: aqa-ci-secret
          AWS_REGION: us-east-1
        run: bun test packages/artifacts/test/s3-live.test.ts

  test-container-sandbox:
    name: Integration (OCI container sandbox)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [typecheck-lint]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build sandbox
        run: bun run --filter @aqa/sandbox build
      - name: Run real Docker sandbox contract
        working-directory: packages/sandbox
        env:
          AQA_TEST_CONTAINER_RUNTIME: docker
        run: bun test test/sandbox.test.ts
      - name: Resolve pinned test image
        run: |
          docker pull alpine:3.20
          echo "AQA_CONTAINER_IMAGE=$(docker image inspect --format '{{index .RepoDigests 0}}' alpine:3.20)" >> "$GITHUB_ENV"
      - name: Run complete hardened kit journey
        env:
          AQA_TEST_CONTAINER_RUNTIME: docker
          AQA_CONTAINER_RUNTIME: docker
        run: |
          bun run build:workspace
          bun test packages/kit/test/run-cmd.test.ts

  validate-helm:
    name: Validate Helm deployment chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate air-gap installer syntax
        run: bash -n scripts/air-gap-install.sh
      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Lint chart
        run: helm lint deploy/helm
      - name: Render default and production-shaped values
        run: |
          helm template aqa deploy/helm > /tmp/aqa-default.yaml
          helm template aqa deploy/helm \
            --set ingress.enabled=true \
            --set ingress.tls.enabled=true \
            --set ingress.tls.secretName=aqa-tls \
            --set postgres.urlSecretRef=aqa-db \
            --set runner.worker.enabled=true \
            --set-string 'runner.worker.scopes[0]=padosoft/*' \
            --set-string runner.worker.tokenSecretRef=aqa-runner-auth \
            --set-string runner.sandbox.image=ghcr.io/padosoft/agentic-qa-kit-sandbox@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef \
            --set runner.reaper.enabled=true \
            --set-string 'networkPolicy.runnerExtraEgressCidrs[0]=10.0.0.0/8' \
            --set cost.reaper.enabled=true \
            --set cost.reaper.ledgerDsnSecretRef=aqa-db \
            > /tmp/aqa-production.yaml
          test -s /tmp/aqa-default.yaml
          test -s /tmp/aqa-production.yaml
          grep -q 'PersistentVolumeClaim' /tmp/aqa-production.yaml
          test "$(grep -c 'name: AQA_STORE_DSN' /tmp/aqa-production.yaml)" -eq 1
          test "$(grep -c 'name: AQA_QUEUE_DSN' /tmp/aqa-production.yaml)" -eq 2
          test "$(grep -c 'name: AQA_IDEMPOTENCY_DSN' /tmp/aqa-production.yaml)" -eq 1
          test "$(grep -c 'name: AQA_OIDC_SESSION_DSN' /tmp/aqa-production.yaml)" -eq 1
          test "$(grep -c 'name: AQA_EVENT_BUS_DSN' /tmp/aqa-production.yaml)" -eq 1
          test "$(grep -c 'name: AQA_SCIM_TOKEN_DSN' /tmp/aqa-production.yaml)" -eq 1
          test "$(grep -c 'name: AQA_SCIM_RATE_LIMIT_DSN' /tmp/aqa-production.yaml)" -eq 1
          test "$(grep -c 'name: AQA_BUDGET_DSN' /tmp/aqa-production.yaml)" -eq 1
          grep -q 'kind: CronJob' /tmp/aqa-production.yaml
          grep -q 'name: AQA_BUDGET_LEDGER_DSN' /tmp/aqa-production.yaml
          grep -q 'name: AQA_RUNNER_QUEUE_DSN' /tmp/aqa-production.yaml
          grep -q 'name: aqa-runner-reaper' /tmp/aqa-production.yaml
          grep -q 'name: AQA_RUNNER_SCOPES' /tmp/aqa-production.yaml
          grep -q 'command:' /tmp/aqa-production.yaml
          ! grep -q 'namespaceSelector: {}' /tmp/aqa-production.yaml

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [typecheck-lint]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (all workspaces)
        run: |
          test -d packages
          npm --prefix docs-site ci
          bun run build

      - name: Generate CycloneDX SBOM for the built repository
        uses: anchore/sbom-action@006b7ce8314066bdf1765b4500370d40fa6917a3
        with:
          path: .
          format: cyclonedx-json
          output-file: aqa-sbom.cdx.json
          artifact-name: aqa-sbom-cyclonedx

      - name: Validate CycloneDX SBOM
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const bom = JSON.parse(readFileSync('aqa-sbom.cdx.json', 'utf8'));
          if (bom.bomFormat !== 'CycloneDX' || !bom.specVersion || !Array.isArray(bom.components) || bom.components.length === 0) {
            throw new Error('SBOM is not a non-empty CycloneDX component inventory');
          }
          console.log(`CycloneDX ${bom.specVersion}: ${bom.components.length} components`);
          NODE

  e2e-cli:
    name: E2E (CLI smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build all workspaces
        run: |
          npm --prefix docs-site ci
          bun run build

      - name: Run CLI smoke checks
        run: bun run test:e2e-cli

      - name: Run installed artifact journey
        # The monorepo smoke uses the compiled workspace entrypoint. This
        # journey creates and extracts the same tarball a consumer installs.
        run: bun run test:e2e-installed-artifact

      - name: Run performance evidence threshold journey
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)"
          cat > "$fixture/k6.json" <<'JSON'
          {"metrics":{"http_req_duration":{"values":{"p(95)":250}}}}
          JSON
          cat > "$fixture/thresholds.json" <<'JSON'
          {"max_p95_ms":100}
          JSON
          set +e
          node packages/kit/dist/cli.cjs ingest k6 "$fixture/k6.json" --threshold-file "$fixture/thresholds.json"
          exit_code=$?
          set -e
          test "$exit_code" -eq 2
          test -n "$(find .aqa/ingest -name '*.threshold.json' -print -quit)"

  e2e:
    name: E2E (Playwright, admin UI)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        # Playwright 1.60 launches Chromium through its separate headless
        # shell in headless CI. Install both artifacts explicitly so a
        # browser package update cannot leave the runner half-provisioned.
        working-directory: packages/admin
        run: bun run test:install-browsers

      - name: Build admin (Vite) for the dev server Playwright will boot
        run: |
          npm --prefix docs-site ci
          bun run build

      - name: Run Playwright (admin SPA)
        working-directory: packages/admin
        run: bun run test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  observability-live:
    name: Integration (live Prometheus + OTLP telemetry)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build workspaces and admin
        run: |
          npm --prefix docs-site ci
          bun run build

      - name: Run live Prometheus scrape and OTLP Collector journey
        env:
          AQA_TEST_OBSERVABILITY_LIVE: '1'
        run: bun run test:observability-live
