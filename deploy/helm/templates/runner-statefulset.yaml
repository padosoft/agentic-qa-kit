{{- if .Values.runner.worker.enabled }}
{{- if and (not .Values.postgres.subchart.enabled) (not .Values.postgres.urlSecretRef) (not .Values.postgres.url) (not .Values.runner.worker.queueDsnSecretRef) }}
{{- fail "runner.worker.enabled requires postgres.subchart.enabled, postgres.url, postgres.urlSecretRef or runner.worker.queueDsnSecretRef" }}
{{- end }}
{{- if eq (len .Values.runner.worker.scopes) 0 }}
{{- fail "runner.worker.scopes must contain at least one org/project or org/* scope when runner.worker.enabled is true" }}
{{- end }}
{{- if not .Values.runner.worker.tokenSecretRef }}
{{- fail "runner.worker.tokenSecretRef is required when runner.worker.enabled is true" }}
{{- end }}
{{- if and .Values.runner.worker.probeDrivers.postgres.enabled (not .Values.runner.worker.probeDrivers.postgres.dsnSecretRef) }}
{{- fail "runner.worker.probeDrivers.postgres.dsnSecretRef is required when PostgreSQL SQL probes are enabled" }}
{{- end }}
{{- if and .Values.runner.worker.probeDrivers.playwright.enabled (eq (len .Values.runner.worker.probeDrivers.playwright.allowedOrigins) 0) }}
{{- fail "runner.worker.probeDrivers.playwright.allowedOrigins must contain an origin when Playwright probes are enabled" }}
{{- end }}
{{- if and .Values.runner.worker.probeDrivers.shell.enabled (eq (len .Values.runner.worker.probeDrivers.shell.allowedCommands) 0) }}
{{- fail "runner.worker.probeDrivers.shell.allowedCommands must contain an executable when shell probes are enabled" }}
{{- end }}
{{- if and .Values.runner.worker.enabled .Values.runner.sandbox.requirePinnedImage (not .Values.runner.sandbox.image) }}
{{- fail "runner.sandbox.image is required when runner.sandbox.requirePinnedImage is true" }}
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-runner
  labels:
    {{- include "aqa.labels" . | nindent 4 }}
    app.kubernetes.io/component: runner
spec:
  serviceName: {{ .Release.Name }}-runner-headless
  replicas: {{ .Values.runner.replicaCount }}
  selector:
    matchLabels:
      {{- include "aqa.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: runner
  template:
    metadata:
      labels:
        {{- include "aqa.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: runner
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: runner
          {{- if and .Values.runner.image.requireDigest (not .Values.runner.image.digest) }}
          {{- fail "runner.image.digest is required when runner.image.requireDigest is true" }}
          {{- end }}
          image: "{{ .Values.runner.image.repository }}{{ if .Values.runner.image.digest }}@{{ .Values.runner.image.digest }}{{ else }}:{{ .Values.runner.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.runner.image.pullPolicy }}
          command:
            {{- toYaml .Values.runner.worker.command | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          env:
            - name: AQA_QUEUE_DSN
              {{- if .Values.runner.worker.queueDsnSecretRef }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.runner.worker.queueDsnSecretRef }}
                  key: {{ .Values.runner.worker.queueDsnSecretKey }}
              {{- else if .Values.postgres.subchart.enabled }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgres
                  key: url
              {{- else if .Values.postgres.urlSecretRef }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.urlSecretRef }}
                  key: url
              {{- else }}
              value: {{ .Values.postgres.url | quote }}
              {{- end }}
            - name: AQA_RUNNER_ROOT
              value: {{ .Values.runner.worker.root | quote }}
            - name: AQA_RUNNER_SCOPES
              value: {{ join "," .Values.runner.worker.scopes | quote }}
            - name: AQA_SERVER_URL
              value: "http://{{ .Release.Name }}-server:8080"
            - name: AQA_RUNNER_TOKEN_FILE
              value: {{ .Values.runner.worker.tokenFile | quote }}
            - name: AQA_DETERMINISM_LEVEL
              value: {{ .Values.determinism.level | quote }}
            - name: AQA_RUNNER_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: AQA_CONTAINER_IMAGE
              value: {{ .Values.runner.sandbox.image | quote }}
            {{- if .Values.runner.worker.probeDrivers.postgres.enabled }}
            - name: AQA_PROBE_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.runner.worker.probeDrivers.postgres.dsnSecretRef }}
                  key: {{ .Values.runner.worker.probeDrivers.postgres.dsnSecretKey }}
            {{- end }}
            {{- if .Values.runner.worker.probeDrivers.playwright.enabled }}
            - name: AQA_PROBE_PLAYWRIGHT_ENABLED
              value: "true"
            - name: AQA_PROBE_PLAYWRIGHT_ALLOWED_ORIGINS
              value: {{ join "," .Values.runner.worker.probeDrivers.playwright.allowedOrigins | quote }}
            {{- end }}
            {{- if .Values.runner.worker.probeDrivers.shell.enabled }}
            - name: AQA_PROBE_SHELL_ENABLED
              value: "true"
            - name: AQA_PROBE_SHELL_ALLOWED_COMMANDS
              value: {{ join "," .Values.runner.worker.probeDrivers.shell.allowedCommands | quote }}
            {{- if .Values.runner.worker.probeDrivers.shell.cwd }}
            - name: AQA_PROBE_SHELL_CWD
              value: {{ .Values.runner.worker.probeDrivers.shell.cwd | quote }}
            {{- end }}
            {{- end }}
          resources:
            {{- toYaml .Values.runner.resources | nindent 12 }}
          volumeMounts:
            - name: fixtures
              mountPath: /var/lib/aqa/fixtures
            - name: runner-token
              mountPath: {{ .Values.runner.worker.tokenFile | quote }}
              subPath: token
              readOnly: true
      volumes:
        - name: runner-token
          secret:
            secretName: {{ .Values.runner.worker.tokenSecretRef }}
            items:
              - key: {{ .Values.runner.worker.tokenSecretKey | quote }}
                path: token
  volumeClaimTemplates:
    - metadata:
        name: fixtures
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.runner.storage.size }}
        {{- if .Values.runner.storage.storageClassName }}
        storageClassName: {{ .Values.runner.storage.storageClassName | quote }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-runner-headless
  labels:
    {{- include "aqa.labels" . | nindent 4 }}
    app.kubernetes.io/component: runner
spec:
  clusterIP: None
  selector:
    {{- include "aqa.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: runner
{{- end }}
