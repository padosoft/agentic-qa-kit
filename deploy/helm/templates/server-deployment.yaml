apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-server
  labels:
    {{- include "aqa.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.server.replicaCount }}
  selector:
    matchLabels:
      {{- include "aqa.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        {{- include "aqa.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: server
    spec:
      {{- if .Values.auth.oidc.enabled }}
      {{- if not .Values.auth.oidc.issuer }}
      {{- fail "auth.oidc.issuer is required when auth.oidc.enabled is true" }}
      {{- end }}
      {{- if not .Values.auth.oidc.clientId }}
      {{- fail "auth.oidc.clientId is required when auth.oidc.enabled is true" }}
      {{- end }}
      {{- if not .Values.auth.oidc.redirectUri }}
      {{- fail "auth.oidc.redirectUri is required when auth.oidc.enabled is true" }}
      {{- end }}
      {{- if not .Values.auth.oidc.clientSecretSecretRef }}
      {{- fail "auth.oidc.clientSecretSecretRef is required when auth.oidc.enabled is true" }}
      {{- end }}
      {{- if not (regexMatch "^[A-Z][A-Z0-9_]*$" .Values.auth.oidc.clientSecretEnv) }}
      {{- fail "auth.oidc.clientSecretEnv must be a valid environment variable name" }}
      {{- end }}
      {{- if not .Values.auth.oidc.clientSecretKey }}
      {{- fail "auth.oidc.clientSecretKey is required when auth.oidc.enabled is true" }}
      {{- end }}
      {{- if not (or .Values.postgres.subchart.enabled .Values.postgres.urlSecretRef .Values.postgres.url) }}
      {{- fail "a PostgreSQL source is required for shared OIDC sessions when auth.oidc.enabled is true" }}
      {{- end }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.server.podSecurityContext | nindent 8 }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: server
          {{- if and .Values.server.image.requireDigest (not .Values.server.image.digest) }}
          {{- fail "server.image.digest is required when server.image.requireDigest is true" }}
          {{- end }}
          image: "{{ .Values.server.image.repository }}{{ if .Values.server.image.digest }}@{{ .Values.server.image.digest }}{{ else }}:{{ .Values.server.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          env:
            - name: AQA_AUDIT_LOG_PATH
              value: {{ .Values.server.auditLogPath | quote }}
            - name: AQA_DETERMINISM_LEVEL
              value: {{ .Values.determinism.level | quote }}
            - name: AQA_MONTHLY_BUDGET_USD
              value: {{ .Values.cost.monthlyBudgetUsd | quote }}
            {{- if .Values.auth.oidc.enabled }}
            - name: AQA_OIDC_ENABLED
              value: "true"
            - name: AQA_OIDC_ISSUER
              value: {{ .Values.auth.oidc.issuer | quote }}
            - name: AQA_OIDC_CLIENT_ID
              value: {{ .Values.auth.oidc.clientId | quote }}
            - name: AQA_OIDC_REDIRECT_URI
              value: {{ .Values.auth.oidc.redirectUri | quote }}
            - name: AQA_OIDC_CLIENT_SECRET_ENV
              value: {{ .Values.auth.oidc.clientSecretEnv | quote }}
            - name: AQA_OIDC_ALLOWED_ENDPOINT_ORIGINS
              value: {{ join "," .Values.auth.oidc.allowedEndpointOrigins | quote }}
            - name: AQA_OIDC_ROLES_CLAIM
              value: {{ .Values.auth.oidc.rolesClaim | quote }}
            - name: AQA_OIDC_MFA_CLAIM
              value: {{ .Values.auth.oidc.mfaClaim | quote }}
            - name: {{ .Values.auth.oidc.clientSecretEnv | quote }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.oidc.clientSecretSecretRef }}
                  key: {{ .Values.auth.oidc.clientSecretKey }}
            {{- end }}
            {{- if .Values.postgres.subchart.enabled }}
            - name: AQA_STORE_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgres
                  key: url
            - name: AQA_IDEMPOTENCY_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgres
                  key: url
            - name: AQA_QUEUE_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgres
                  key: url
            - name: AQA_OIDC_SESSION_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgres
                  key: url
            - name: AQA_EVENT_BUS_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgres
                  key: url
            - name: AQA_SCIM_TOKEN_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgres
                  key: url
            - name: AQA_SCIM_RATE_LIMIT_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgres
                  key: url
            - name: AQA_BUDGET_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgres
                  key: url
            {{- else if .Values.postgres.urlSecretRef }}
            - name: AQA_STORE_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.urlSecretRef }}
                  key: url
            - name: AQA_IDEMPOTENCY_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.urlSecretRef }}
                  key: url
            - name: AQA_QUEUE_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.urlSecretRef }}
                  key: url
            - name: AQA_OIDC_SESSION_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.urlSecretRef }}
                  key: url
            - name: AQA_EVENT_BUS_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.urlSecretRef }}
                  key: url
            - name: AQA_SCIM_TOKEN_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.urlSecretRef }}
                  key: url
            - name: AQA_SCIM_RATE_LIMIT_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.urlSecretRef }}
                  key: url
            - name: AQA_BUDGET_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.urlSecretRef }}
                  key: url
            {{- else if .Values.postgres.url }}
            - name: AQA_STORE_DSN
              value: {{ .Values.postgres.url | quote }}
            - name: AQA_IDEMPOTENCY_DSN
              value: {{ .Values.postgres.url | quote }}
            - name: AQA_QUEUE_DSN
              value: {{ .Values.postgres.url | quote }}
            - name: AQA_OIDC_SESSION_DSN
              value: {{ .Values.postgres.url | quote }}
            - name: AQA_EVENT_BUS_DSN
              value: {{ .Values.postgres.url | quote }}
            - name: AQA_SCIM_TOKEN_DSN
              value: {{ .Values.postgres.url | quote }}
            - name: AQA_SCIM_RATE_LIMIT_DSN
              value: {{ .Values.postgres.url | quote }}
            - name: AQA_BUDGET_DSN
              value: {{ .Values.postgres.url | quote }}
            {{- end }}
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            {{- toYaml .Values.server.containerSecurityContext | nindent 12 }}
          startupProbe:
            tcpSocket: { port: http }
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 20
            failureThreshold: 3
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          volumeMounts:
            - name: audit-log
              mountPath: /var/lib/aqa
      volumes:
        - name: audit-log
          {{- if .Values.server.auditPersistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-server-audit
          {{- else }}
          emptyDir: {}
          {{- end }}
